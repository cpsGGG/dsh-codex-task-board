# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# The plugin is browser-only: the node half is an inert `apply()` whose sole
# job is to give the host Loader a row to mount, so the client-modules scan can
# discover `dsh.client` and serve `lib/client.js` to the web shell.
- insert:
    - id: codex-task-board
      name: 'dsh-codex-task-board'
